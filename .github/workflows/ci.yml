name: CI

on:
  push:
  pull_request:

jobs:
  check-manifest:
    name: Check Manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uvx check-manifest

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run pytest --cov=markdown_changelog --cov-report=xml
      - uses: codecov/codecov-action@v5
        if: matrix.python-version == '3.15'
        with:
          files: coverage.xml
          fail_ci_if_error: false

  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.13"
      - run: uv build
      - run: uvx twine check dist/*
      - run: uv sync --locked --group dev
      - run: uv run ruff check markdown_changelog tests
      - uses: actions/upload-artifact@v7
        with:
          name: python-package
          path: dist/*
