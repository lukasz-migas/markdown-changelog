[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "markdown-changelog"
version = "0.0.4"
description = "Python-Markdown extension for changelog badges"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lukasz G. Migas", email = "lukas.migas@yahoo.com" }]
requires-python = ">=3.11"
dependencies = ["Markdown>=3.4"]
keywords = ["text", "filter", "markdown", "html", "changelog"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Filters",
    "Topic :: Text Processing :: Markup :: HTML",
]

[project.urls]
Homepage = "https://github.com/lukasz-migas/markdown-changelog"
Repository = "https://github.com/lukasz-migas/markdown-changelog"
Documentation = "https://lukasz-migas.github.io/markdown-changelog/"

[project.entry-points."markdown.extensions"]
changelog = "markdown_changelog:ChangelogExtension"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.11"]
docs = ["zensical"]

[tool.setuptools.packages.find]
include = ["markdown_changelog*"]

[tool.pytest.ini_options]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
    "ignore::RuntimeWarning",
    "ignore::ImportWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["markdown_changelog"]
parallel = true
omit = ["tests/*", "*/__init__.py"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E203", "E722", "E741", "W605", "F841"]

# https://github.com/mgedmin/check-manifest#configuration
[tool.check-manifest]
ignore = [
    ".github_changelog_generator",
    ".pre-commit-config.yaml",
    ".ruff_cache/**/*",
    "setup.py",
    "tests/**/*",
    "**/*_version.py",
    "*.json",
    ".idea/*",
    ".idea/*/*",
    "misc/*",
    "tox.ini",
    "codecov.yml",
    "Makefile",
    "venv/*",
    "CLAUDE.md",
    "uv.lock",
    "renovate.json",
    "zensical.toml",
]